config_version = 14

[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
background_opacity = 0.74999998323619366
center = [ "clock", "caffeine" ]
contact_shadow = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = 0
start = [ "workspaces", "sysmon", "media" ]

[battery.device."/org/freedesktop/UPower/devices/mouse_dev_F5_54_74_9C_0E_65"]
warning_threshold = 10

[brightness]
enable_ddcutil = true

[calendar]

[control_center.calendar]
show_events_card = false

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "suspend"
    enabled = false
    lock_before_suspend = false
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 180.0

[location]
address = "Shanghai,China"

[lockscreen]
blur_intensity = 0.29999999329447746

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 1029.0
    output = "HDMI-A-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 789.29998779296875
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 288.0
    cx = 720.0
    cy = 435.5999755859375
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        shadow = false

[shell]
date_format = "%x,%A"
launch_apps_custom_command = "uwsm app -- $CMD"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.panel]
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl suspend"
    countdown_seconds = 0.0
    enabled = true
    glyph = "suspend"
    label = "挂起"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    command = "hyprshutdown"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    command = "hyprshutdown -t '正在重启...' --post-cmd 'reboot'"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    command = "hyprshutdown -t '正在关机...' --post-cmd 'shutdown -P 0'"
    countdown_seconds = 0.0
    enabled = true
    variant = "primary"

[theme]
builtin = "Tokyo-Night"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [
        "opencode",
        "pywalfox",
        "telegram",
        "neovim",
        "obsidian",
        "vscode",
        "steam",
        "hyprtoolkit",
        "papirus-icons",
        "yazi"
    ]

[wallpaper]
directory = "/usr/share/wallpapers/ScarletTree/contents/images_dark"

    [wallpaper.default]
    path = "/usr/share/wallpapers/ScarletTree/contents/images_dark/5120x2880.png"

    [wallpaper.last]
    path = "/usr/share/wallpapers/ScarletTree/contents/images_dark/5120x2880.png"

[widget.battery]
hide_when_full = true
hide_when_plugged = true
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
anchor = true

[widget.media]
hide_when_no_media = true

[widget.notifications]
hide_when_no_unread = true

[widget.volume]
show_label = false