[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
background_opacity = 0.74999998323619366
contact_shadow = true
margin_ends = 10
start = [ "launcher", "workspaces" ]

[battery.device."/org/freedesktop/UPower/devices/mouse_dev_F5_54_74_9C_0E_65"]
warning_threshold = 10

[brightness]
enable_ddcutil = true

[lockscreen]
blur_intensity = 0.29999999329447746

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 1024.0
    cy = 1029.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 800.0
    cy = 877.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 288.0
    cx = 800.0
    cy = 484.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        shadow = false

[shell]
date_format = "%x,%A"
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl suspend"
    enabled = true
    glyph = "suspend"
    label = "挂起"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    enabled = true
    glyph = "zzz"
    label = "休眠"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    command = "hyprshutdown -t '正在关机...' --post-cmd 'shutdown -P 0'"
    enabled = true
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    command = "hyprshutdown -t '正在重启...' --post-cmd 'reboot'"
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    command = "hyprshutdown"
    enabled = true
    variant = "default"

[theme]
builtin = "Tokyo-Night"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "pywalfox", "neovim", "obsidian", "vscode", "steam", "telegram", "yazi", "hyprtoolkit" ]

[wallpaper]
directory = "/usr/share/wallpapers/ScarletTree/contents/images_dark"

    [wallpaper.default]
    path = "/usr/share/wallpapers/ScarletTree/contents/images_dark/5120x2880.png"

    [wallpaper.last]
    path = "/usr/share/wallpapers/ScarletTree/contents/images_dark/5120x2880.png"

[weather]
enabled = false

[widget.battery]
hide_when_full = true
hide_when_plugged = true
show_label = false

[widget.brightness]
show_label = false

[widget.media]
hide_when_no_media = true

[widget.notifications]
hide_when_no_unread = true

[widget.volume]
show_label = false