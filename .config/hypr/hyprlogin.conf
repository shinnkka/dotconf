# sample hyprlogin.conf
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
#
# shortcuts:
# - ESC on an empty password field returns to username entry
# - ESC / Ctrl+U / Ctrl+Backspace clear the current field
# - Tab / Shift+Tab cycle the selected session
#
# active config path: /etc/hyprlogin/hyprlogin.conf
# if that file does not exist, hyprlogin falls back to the installed example config
#
# optional greeter defaults:
sessions:default_user = shinka
sessions:default_session = hyprland.desktop
#

$font = Monospace

general {
    hide_cursor = false
    immediate_render = true
    exit_command = hyprctl dispatch exit
    fail_timeout = 4000
    debug_mode = false
    debug_log_path = /tmp/hyprlogin-debug.log

}

animations {
    enabled = true
    bezier = smooth,0.25,1,0.5,1

    animation = fadeIn,1,4,smooth
    animation = fadeOut,1,4,smooth
    animation = inputFieldDots,1,2,smooth
}

background {
    monitor =
    path = /usr/share/wallpapers/ScarletTree/contents/images_dark/5120x2880.png

    blur_passes = 1
}

input-field {
    monitor =

    size = 20%,5%

    outline_thickness = 2
    rounding = 16

    inner_color = rgba(1d1c2b99)

    outer_color = rgba(7568d8ee) rgba(7b93d8ee) 45deg
    check_color = rgba(7b93d8ee) rgba(a084dcff) 45deg
    fail_color = rgba(ca6b82ff)

    font_color = rgba(aeb4e6ff)

    font_family = $font

    fade_on_empty = false

    placeholder_text = 输入密码
    placeholder_text_username = 用户名

    fail_text = 密码错误

    dots_spacing = 0.28
    dots_size = 0.28

    position = 0,-20
    halign = center
    valign = center
}

label {
    monitor =

    text = $TIME
    color = rgba(b3b0d9ff)

    font_size = 92
    font_family = $font

    position = 0,200
    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:60000] date +"%Y %B %d, %A"

    color = rgba(b3b0d9ff)

    font_size = 22
    font_family = $font

    position = 0,100
    halign = center
    valign = center
}

label {
    monitor =

    text = $GREETD_SESSION

    color = rgba(8e96c7ff)

    font_size = 16
    font_family = $font

    position = 0,-120
    halign = center
    valign = center

    onclick = hyprlogin:session_next
}
